<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Zadanie 36</title>
  <style>
    body {
      background-color: #f25cb2; 
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .blok {
      border: 3px solid black;
      background-color: #6d9bf1; 
      width: 70%;
      margin: 20px auto;
      padding: 10px;
    }

    h1 {
      background-color: yellow;
      border: 3px solid black;
      padding: 10px;
      margin: 10px auto;
      width: 60%;
      font-size: 28px;
    }

    h2 {
      background-color: #b85e5e;
      color: black;
      border: 3px solid black;
      padding: 8px;
      margin: 10px auto;
      width: 50%;
      font-size: 20px;
    }

    h3 {
      background-color: #9cc8f1;
      color: black;
      border: 3px solid black;
      padding: 8px;
      margin: 10px auto;
      width: 50%;
      font-size: 16px;
    }

    hr.linia1 {
      border: none;
      height: 4px;
      background-color: black;
      width: 95%;
    }

    hr.linia2 {
      border: none;
      height: 3px;
      background-color: red;
      width: 85%;
    }

    hr.linia3 {
      border: none;
      height: 3px;
      background-color: blue;
      width: 70%;
    }
  </style>
</head>
<body>

  <div class="blok">
    <h1>To jest przykład</h1>
  </div>

  <hr class="linia1">

  <div class="blok">
    <h2>To jest przykład wykonaj sam</h2>
  </div>

  <hr class="linia2">

  <div class="blok">
    <h3>To jest przykład wykonaj również</h3>
  </div>

  <hr class="linia3">

</body>
</html>
